services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RELATIONSCOPE_MODEL_DIR: /models/current
      RELATIONSCOPE_DEVICE: cpu
    volumes:
      - ./artifacts/transformer/best:/models/current:ro
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      RELATIONSCOPE_API_URL: http://api:8080
      RELATIONSCOPE_API_AUDIENCE: ""
    depends_on:
      - api
    ports:
      - "3000:8080"

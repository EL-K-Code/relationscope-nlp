[project]
name = "relationscope-nlp"
version = "0.1.0"
description = "Production-grade Relation Extraction & Knowledge Structuring Engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "google-cloud-storage>=3.0",
  "httpx>=0.27",
  "joblib>=1.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "tqdm>=4.66",
  "transformers>=4.46",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
legacy = [
  "matplotlib>=3.9",
  "tensorflow>=2.19,<2.20",
  "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["relationscope"]
mypy_path = "src"
warn_unused_ignores = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relationscope"]
